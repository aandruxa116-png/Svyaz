name: Web stability checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Real browser and SDK with synthetic Auth/Firestore only
        run: node_modules/.bin/firebase emulators:exec --only auth,firestore --project demo-svyaz --config firebase.test.json 'npm run test:browser'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: test-results/
