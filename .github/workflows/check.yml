name: Web stability checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unchanged stage 1 main for before screenshots
        uses: actions/checkout@v4
        with:
          ref: 661659a2552095dd0abbf533760e0853a241c968
          path: tests/.baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Real browser and SDK with synthetic Auth/Firestore only
        env:
          DESIGN_PREVIEWS: '1'
        run: node_modules/.bin/firebase emulators:exec --only auth,firestore --project demo-svyaz --config firebase.test.json 'npm run test:browser'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-stage2-screenshots-and-tests
          path: test-results/
